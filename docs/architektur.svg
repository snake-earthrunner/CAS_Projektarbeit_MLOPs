<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 450" width="1030" height="450" role="img" aria-label="Architektur: USGS liefert Daten an die Feature Pipeline, diese schreibt Features und Label in den Hopsworks Feature Store. Die Training Pipeline holt die Trainingsdaten über die Feature View und speichert model.joblib. Die Inference Pipeline liest zwei Features aus dem Feature Store, berechnet vier RT-Features live aus USGS-Daten und lädt das Modell." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
text{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace;fill:#161a1d}
.d{fill:#59646b}.a{fill:#2358c4}.e{fill:#a8500c}.b{font-weight:600}
.box{fill:#ffffff;stroke:#161a1d;stroke-width:1.2}
.boxA{fill:#e8eefb;stroke:#2358c4;stroke-width:1.4}
.boxE{fill:#fbede1;stroke:#a8500c;stroke-width:1.4}
.ln{stroke:#161a1d;stroke-width:1.4;fill:none}
.lnA{stroke:#2358c4;stroke-width:1.6;fill:none}
.lnE{stroke:#a8500c;stroke-width:1.6;fill:none}
</style>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#161a1d"/></marker>
<marker id="arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#2358c4"/></marker>
<marker id="arE" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#a8500c"/></marker>
</defs>
<rect x="0" y="0" width="1030" height="450" fill="#ffffff"/>


<path class="ln" d="M770 30 H800"/><text class="d" x="808" y="34" font-size="10.5">Code und lokale Dateien</text>
<path class="lnA" d="M770 50 H800"/><text class="d" x="808" y="54" font-size="10.5">Feature Store</text>
<path class="lnE" d="M770 70 H800"/><text class="d" x="808" y="74" font-size="10.5">Internet, extern</text>

<rect class="boxE" x="30" y="20" width="220" height="56" rx="4"/>
<text class="b e" x="140" y="44" text-anchor="middle" font-size="13">USGS-Katalog</text>
<text class="d" x="140" y="62" text-anchor="middle" font-size="10.5">earthquake.usgs.gov · HTTPS</text>
<path class="lnE" d="M140 76 V148" marker-end="url(#arE)"/>
<text class="d" x="150" y="118" font-size="10.5">2001 bis heute, M ≥ 3.0</text>

<rect class="box" x="30" y="150" width="220" height="120" rx="4"/>
<text class="b" x="140" y="174" text-anchor="middle" font-size="13">1 Feature Pipeline</text>
<text class="d" x="140" y="192" text-anchor="middle" font-size="10.5">feature_pipeline/main.py</text>
<text class="d" x="140" y="216" text-anchor="middle" font-size="10.5">Bebenserien bilden</text>
<text class="d" x="140" y="232" text-anchor="middle" font-size="10.5">Features + Label rechnen</text>
<text class="d" x="140" y="248" text-anchor="middle" font-size="10.5">b-Wert pro Tag rechnen</text>

<path class="lnA" d="M250 210 H340" marker-end="url(#arA)"/>
<text class="a" x="295" y="172" text-anchor="middle" font-size="10.5">schreibt</text>
<text class="a" x="295" y="186" text-anchor="middle" font-size="10.5">Features</text>
<text class="a" x="295" y="200" text-anchor="middle" font-size="10.5">+ Label</text>

<rect class="boxA" x="342" y="100" width="330" height="214" rx="4"/>
<text class="b a" x="507" y="124" text-anchor="middle" font-size="13">Hopsworks Feature Store</text>
<rect class="box" x="356" y="140" width="302" height="48" rx="3"/>
<text class="b" x="368" y="160" font-size="10.5">Feature Group nachbeben_snapshots</text>
<text class="d" x="368" y="177" font-size="10">rund 91'900 Messpunkte</text>
<rect class="box" x="356" y="196" width="302" height="48" rx="3"/>
<text class="b" x="368" y="216" font-size="10.5">Feature Group regionaler_b_wert</text>
<text class="d" x="368" y="233" font-size="10">ein b-Wert pro Tag</text>
<rect class="box" x="356" y="252" width="302" height="48" rx="3"/>
<text class="b" x="368" y="272" font-size="10.5">Feature View nachbeben_snapshots_view</text>
<text class="d" x="368" y="289" font-size="10">verbindet beide über «tag»</text>

<path class="lnA" d="M672 170 H758" marker-end="url(#arA)"/>
<text class="a" x="715" y="146" text-anchor="middle" font-size="10.5">Trainings-</text>
<text class="a" x="715" y="160" text-anchor="middle" font-size="10.5">daten</text>

<rect class="box" x="760" y="100" width="240" height="100" rx="4"/>
<text class="b" x="880" y="124" text-anchor="middle" font-size="13">2 Training Pipeline</text>
<text class="d" x="880" y="142" text-anchor="middle" font-size="10.5">training_pipeline/main.py</text>
<text class="d" x="880" y="164" text-anchor="middle" font-size="10.5">training_data(), ab 2013</text>
<text class="d" x="880" y="180" text-anchor="middle" font-size="10.5">StandardScaler + LogReg</text>

<path class="ln" d="M880 200 V232" marker-end="url(#ar)"/>
<rect class="box" x="760" y="234" width="240" height="46" rx="4"/>
<text class="b" x="880" y="254" text-anchor="middle" font-size="12">model.joblib</text>
<text class="d" x="880" y="270" text-anchor="middle" font-size="10">Datei, nur lokal</text>

<path class="lnA" d="M507 314 V362" marker-end="url(#arA)"/>
<text class="a" x="517" y="342" font-size="10.5">liest 2 Features</text>
<path class="ln" d="M880 280 V400 H692" marker-end="url(#ar)"/>
<text class="d" x="890" y="344" font-size="10.5">lädt das Modell</text>
<path class="lnE" d="M30 48 H12 V400 H388" marker-end="url(#arE)"/>
<text class="e" x="24" y="372" font-size="10.5">live: Beben der letzten 21 Tage,</text>
<text class="e" x="24" y="386" font-size="10.5">daraus die 4 RT-Features</text>

<rect class="box" x="390" y="364" width="300" height="72" rx="4"/>
<text class="b" x="540" y="388" text-anchor="middle" font-size="13">3 Inference Pipeline</text>
<text class="d" x="540" y="406" text-anchor="middle" font-size="10.5">inference_pipeline/main.py</text>
<text class="d" x="540" y="424" text-anchor="middle" font-size="10.5">gibt die Wahrscheinlichkeit aus</text>
</svg>
